# ---- Notable gaps vs the Access UI feature set ----
# (These are listed for visibility; matrix.md is where pairing happens.)
gaps_vs_access:
  - description: "No bibliography / Texts query (Form_LookAtTexts in Access)"
  - description: "No kinship recursive-traversal (Form_LookAtKinship in Access) — only 1-hop in PersonBrowser"
  - description: "No association-pairs path query (Form_LookAtAssociationPairs in Access)"
  - description: "No personal-network expansion (Form_LookAtNetworks in Access)"
  - description: "No GIS / Neo4j / UCINet / Pajek / Gephi exports — those are batch-export workflows on the Access side"
  - description: "No place-centric query screen (Form_LookAtPlace in Access)"
