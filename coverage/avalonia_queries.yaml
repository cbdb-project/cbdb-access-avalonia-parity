# Avalonia query inventory (Phase 2)
#
# Crawled from cbdb-desktop-app/Cbdb.App.Core/I*Service.cs interfaces.
# Each entry corresponds to one user-facing query feature backed by a
# service interface in the .NET test-host. SQLite-implementation lives
# in cbdb-desktop-app/Cbdb.App.Data/Sqlite*Service.cs.
#
# Schema:
#   id          stable snake_case key used by coverage/matrix.md
#   service     IFoo interface name
#   ui_screen   primary Avalonia window/screen (null for diagnostics)
#   methods     ordered list of public methods on the interface
#     name        method name
#     params      brief argument list (sqlitePath/cancellationToken omitted)
#     returns     return type
#     description one-line semantic
#     kind        list | detail | lookup | diagnostic
#   status      implemented | missing

version: 1
generated_from:
  repo: cbdb-desktop-app
  commit_sha: 8d2b22b4a87c254c69e3572d3120f1a8e02f14c5
  branch: docs/access-parity-implementation-plan
  paths:
    - Cbdb.App.Core/I*.cs
    - Cbdb.App.Avalonia/Modules/

