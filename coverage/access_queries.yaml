design_patterns_borrowed_for_our_harness:
  - id: result_normalization
    description: "Access writes each query result to a per-form ZZ_SCRATCH_<X> table; tests read via pandas + set-based person_id comparison. Handles NULL years correctly."
  - id: bilingual_year_modes
    description: "FrameYears/FrameFilterYears form controls encode 1=no-filter, 2=index-years, 3=dynasty; cbdb_replay/common.py::YearMode mirrors this."
  - id: fixture_discovery
    description: "analysis/discover_test_inputs.py finds top-N codes by person count, top code×dynasty combos, high-degree persons → JSON → parametrized tests. Tests pytest.skip if JSON missing."
  - id: export_format_pinning
    description: "cbdb_replay/exports.py re-implements each CmdGIS/CmdNeo4j/CmdUCINet in Python; tests diff bytes against VBA output. REGEN_REAL_EXPORTS=1 env var blesses goldens."
  - id: com_resilience
    description: "Hybrid COM + pywinauto + pyodbc; GetActiveObject re-acquires when pywinauto disconnects. Application.Run blocked by Access security model."
  - id: vba_injection
    description: "cbdb_driver/vba_inject.py regex-patches VBA on load (remove SetFocus, neutralize debug MsgBox). VbaInjector.patch() wraps each Sub body; auto-applied by make_fixture()."
