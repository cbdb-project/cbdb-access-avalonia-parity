# CBDB Access query inventory (Phase 2)
#
# Crawled from cbdb-user-mdb-tests/tests/test_vba_*.py + cbdb_driver/ +
# cbdb_replay/. Each entry corresponds to one VBA command on one Form_*
# screen that the existing automated test framework drives.
#
# Schema:
#   id            stable snake_case key used by coverage/matrix.md
#   category      human-readable group (form + action)
#   driver        cbdb_driver (real Access UI via pywinauto)
#                 cbdb_replay (Python SQL equivalent)
#                 both (used together — typical pattern)
#   vba_command   CmdQuery / CmdGIS / CmdNeo4j / CmdUCINet / etc.
#   form          Form_LookAtEntry / Form_LookAtOffice / ...
#   test_files    pytest files exercising it
#   status        one of:
#                   implemented_in_tests
#                   implemented_in_tests_issue_22_vulnerable
#                   gap_issue_XX (e.g. gap_issue_22)
#                   gap_timeout
#                   gap_unclear_scope
#   description   one-line semantic

